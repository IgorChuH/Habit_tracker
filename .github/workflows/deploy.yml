name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, future, feature ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Prepare server directory
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || '22' }}
        script: |
          # Создаем директорию
          mkdir -p ~/habit-tracker
          
          # Очищаем старую версию (но сохраняем .env)
          if [ -f ~/habit-tracker/.env ]; then
            cp ~/habit-tracker/.env ~/.env.backup
          fi
          
          rm -rf ~/habit-tracker/*
          
          if [ -f ~/.env.backup ]; then
            cp ~/.env.backup ~/habit-tracker/.env
          fi
          
          echo "Directory ready: ~/habit-tracker"

    - name: Copy files to server (excluding .git)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || '22' }}
        source: "."
        target: "~/habit-tracker"
        strip_components: 0
        overwrite: true
        exclude: |
          .git/
          .gitignore
          .env
          __pycache__/
          *.pyc
          venv/
          .idea/
          .vscode/
          *.log
          .DS_Store

    - name: Deploy with Docker Compose
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || '22' }}
        script: |
          cd ~/habit-tracker
          
          # Создаем .env из .env.example если нужно
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo "⚠️ Please update .env with actual values on the server"
            echo "Run: nano ~/habit-tracker/.env"
          fi
          
          # Останавливаем старые контейнеры
          docker-compose down || true
          
          # Собираем и запускаем
          docker-compose up -d --build
          
          # Проверяем статус
          docker-compose ps
          
          # Очищаем старые образы
          docker system prune -f || true